<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة الأستاذ – STAND UP</title>
<style>
:root{--ink:#1d3a46;--teal:#1f8a8a;--sun:#ffb938;--coral:#ef6f5e;--paper:#fff8e8;--leaf:#6cbf6a}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Geeza Pro",Arial,sans-serif;background:#1f4e5f;color:var(--ink);min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{margin:0;color:#fff;font-size:26px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:14px}
button,input{font:inherit}
button{cursor:pointer;border:3px solid var(--ink);border-radius:12px;background:var(--sun);color:var(--ink);font-weight:800;padding:8px 14px;box-shadow:0 3px 0 var(--ink)}
button.alt{background:#fff}button.bad{background:var(--coral);color:#fff}
input{padding:10px;border:3px solid var(--ink);border-radius:12px;background:#fff;min-width:200px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:9px 8px;border-bottom:2px solid #1d3a4622;text-align:right;font-size:15px}
th{font-size:13px;background:#fff}
tr.row{cursor:pointer}tr.row:hover{background:#ffeec2}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:800;border:2px solid var(--ink)}
.ok{background:#d9f2d2}.warn{background:#ffe0a8}.bad{background:#ffc9c0}
.msg{color:var(--coral);font-weight:800}
.det h3{margin:12px 0 6px;color:var(--teal)}
.ch{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;margin:6px 0;line-height:1.7}
.ch small{display:block;color:#1d3a46aa;font-weight:700}
.flags li{margin:3px 0;font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><h1>لوحة الأستاذ · STAND UP</h1>
  <div id="tools" class="hide"><button id="rf">تحديث</button> <button id="ex" class="alt">تصدير Excel</button> <button id="cl" class="bad">حذف كل النتائج</button></div></div>

 <div id="login" class="card">
  <p style="margin-top:0;font-weight:700">أدخل كلمة مرور الأستاذ لعرض النتائج.</p>
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password"> <button id="go">دخول</button>
  <p id="err" class="msg"></p>
 </div>

 <div id="main" class="hide">
  <div class="card"><div class="stats" id="stats"></div></div>
  <div class="card"><div class="scroll"><table><thead><tr>
   <th>الطالب</th><th>التاريخ</th><th>النقاط</th><th>التعاطف</th><th>مستوى التعامل</th><th>الإنذارات</th><th>الاتساق</th></tr></thead>
   <tbody id="tb"></tbody></table></div>
   <p id="empty" class="hide">لم تصل نتائج بعد. تظهر هنا بمجرد أن يُنهي طالب اللعبة.</p></div>
  <div id="det" class="card det hide"></div>
 </div>
</div>
<script>
const $=i=>document.getElementById(i);
const MT=['داخل الصف','النقاش بعد مساندة زميل','المقصف','التنمر الإلكتروني','مقابلة المرشد','مبادرة ساحة المدرسة'];
let PW=sessionStorage.getItem('tpw')||'',DATA=[];
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML}
function an(r){
 const L=r.log||[],g=L.filter(x=>x.mx>0);
 const got=g.reduce((a,x)=>a+Math.max(x.p,0),0),mx=g.reduce((a,x)=>a+x.mx,0);
 const level=mx?Math.round(got/mx*100):0;
 const best=g.filter(x=>x.p>=x.mx).length;
 const neg=L.filter(x=>x.p<0).length;
 const fast=L.length?L.filter(x=>x.rt<2500).length/L.length:0;
 const rs=g.map(x=>Math.min(1,Math.max(0,x.p/x.mx))),mean=rs.reduce((a,b)=>a+b,0)/(rs.length||1);
 const sd=Math.sqrt(rs.reduce((a,b)=>a+(b-mean)**2,0)/(rs.length||1));
 const fl=[];
 if(fast>=.4)fl.push('أجاب أكثر من 40% من الأسئلة في أقل من 2.5 ثانية، أي بلا وقت كافٍ للقراءة.');
 if(level>=95&&fast>=.3)fl.push('اختار الأفضل تقريبًا في كل موقف وبسرعة، وقد يكون يخمّن الإجابة المتوقعة.');
 if(neg>0)fl.push('اختار تصرفًا عنيفًا '+neg+' مرة.');
 if(r.warn>0)fl.push('تلقّى '+r.warn+' إنذار.');
 if(sd>.35)fl.push('مستواه يتفاوت كثيرًا بين موقف وآخر.');
 return{level,best,n:g.length,neg,fast,fl,ok:fl.length===0}}
function load(){
 fetch('/api/data',{headers:{'x-teacher-password':PW}}).then(r=>{
  if(r.status==401){PW='';sessionStorage.removeItem('tpw');throw new Error('كلمة المرور غير صحيحة')}
  if(!r.ok)throw new Error('تعذّر تحميل النتائج (تأكد من ربط قاعدة البيانات)');return r.json()}).then(d=>{
  DATA=d;sessionStorage.setItem('tpw',PW);$('login').classList.add('hide');$('main').classList.remove('hide');$('tools').classList.remove('hide');render()
 }).catch(e=>{$('err').textContent=e.message;$('login').classList.remove('hide');$('main').classList.add('hide');$('tools').classList.add('hide')})}
function render(){
 const A=DATA.map(an),n=DATA.length,avg=f=>n?Math.round(DATA.reduce((a,r,i)=>a+f(r,i),0)/n):0;
 $('stats').innerHTML=`<div class="stat"><b>${n}</b>طالب أنهى اللعبة</div><div class="stat"><b>${avg(r=>r.sc)}</b>متوسط النقاط</div><div class="stat"><b>${avg((r,i)=>A[i].level)}%</b>متوسط مستوى التعامل</div><div class="stat"><b>${A.filter(a=>!a.ok).length}</b>يحتاجون مراجعة</div>`;
 $('empty').classList.toggle('hide',n>0);
 $('tb').innerHTML=DATA.map((r,i)=>`<tr class="row" data-i="${i}"><td><b>${esc(r.name)}</b></td><td>${new Date(r.at).toLocaleDateString('ar')}</td><td>${r.sc}</td><td>${r.emp}%</td><td>${A[i].level}%</td><td>${r.warn||0}</td><td><span class="tag ${A[i].ok?'ok':A[i].neg?'bad':'warn'}">${A[i].ok?'متّسق':'يحتاج مراجعة'}</span></td></tr>`).join('');
 document.querySelectorAll('tr.row').forEach(t=>t.onclick=()=>detail(+t.dataset.i))}
function detail(i){
 const r=DATA[i],a=an(r),by={};(r.log||[]).forEach(x=>(by[x.m]=by[x.m]||[]).push(x));
 let h=`<h2 style="margin-top:0">${esc(r.name)}</h2><div class="stats"><div class="stat"><b>${r.sc}</b>النقاط</div><div class="stat"><b>${a.level}%</b>مستوى التعامل</div><div class="stat"><b>${a.best}/${a.n}</b>اختار الأفضل</div><div class="stat"><b>${Math.round(a.fast*100)}%</b>إجابات سريعة جدًا</div></div>`;
 h+=a.fl.length?`<h3>ملاحظات للمراجعة</h3><ul class="flags">${a.fl.map(f=>'<li>'+esc(f)+'</li>').join('')}</ul>`:'<h3>الاتساق</h3><p>لا توجد ملاحظات: إجاباته متّسقة ومعقولة التوقيت.</p>';
 h+='<p style="font-size:13px;color:#1d3a46bb">هذه مؤشرات مساعدة وليست حكمًا نهائيًا على الطالب.</p>';
 Object.keys(by).sort().forEach(m=>{h+=`<h3>${esc(MT[m]||'موقف')}</h3>`+by[m].map(x=>`<div class="ch">${esc(x.t)}<small>${x.p*10} نقطة من أصل ${x.mx*10} ممكنة · وقت الإجابة ${(x.rt/1000).toFixed(1)} ث</small></div>`).join('')});
 $('det').innerHTML=h;$('det').classList.remove('hide');$('det').scrollIntoView({behavior:'smooth'})}
$('go').onclick=()=>{PW=$('pw').value;$('err').textContent='';load()};
$('pw').onkeydown=e=>{if(e.key=='Enter')$('go').click()};
$('rf').onclick=load;
$('cl').onclick=()=>{if(confirm('سيتم حذف نتائج كل الطلاب نهائيًا. متأكد؟'))fetch('/api/data',{method:'DELETE',headers:{'x-teacher-password':PW}}).then(()=>{$('det').classList.add('hide');load()})};
$('ex').onclick=()=>{
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['الاسم','التاريخ','النقاط','التعاطف','مستوى التعامل %','الإنذارات','الاتساق','ملاحظات']];
 DATA.forEach(r=>{const a=an(r);rows.push([r.name,new Date(r.at).toLocaleString('ar'),r.sc,r.emp,a.level,r.warn||0,a.ok?'متّسق':'يحتاج مراجعة',a.fl.join(' | ')])});
 const b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='standup-results.csv';u.click()};
if(PW)load();
</script>
</body>
</html>
